<!-- Add this JavaScript to handle the LLM analysis -->
<script>
// LLM Analysis Mode Toggle
document.getElementById('useLLMAnalysis').addEventListener('change', function() {
    document.getElementById('deepDiveOption').style.display = 
        this.checked ? 'block' : 'none';
});

// Update the analyze button click handler to use LLM if selected
const originalAnalyzeHandler = document.getElementById('analyzeButton').onclick;

document.getElementById('analyzeButton').addEventListener('click', function(e) {
    e.preventDefault();
    
    const text = document.getElementById('textInput').value.trim();
    
    // Validation (same as before)
    if (!text) {
        showError('Please enter some text to analyze.');
        return;
    }
    
    const words = text.split(/\s+/).length;
    const maxWords = 5000;
    
    if (words > maxWords) {
        showError(`Your text has ${words} words but the limit is ${maxWords}.`);
        return;
    }
    
    const useLLM = document.getElementById('useLLMAnalysis').checked;
    const useDeepDive = document.getElementById('useDeepDive').checked && useLLM;
    
    // Choose endpoint based on user preference
    let endpoint = '/analyze/';
    let payload = { text };
    
    if (useDeepDive) {
        endpoint = '/analyze-deepdive/';
        // Request deep dive for assumptions with high risk or low confidence
        payload.assumption_indices = [0, 1, 2]; // Adjust as needed
    } else if (useLLM) {
        endpoint = '/analyze-llm/';
    }
    
    analyzeText(endpoint, payload);
});

function analyzeText(endpoint, payload) {
    const resultDiv = document.getElementById('result');
    resultDiv.innerHTML = '<div class="loading"><div class="spinner"></div><p>Analyzing assumptions...</p></div>';
    
    fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    })
    .then(response => {
        if (!response.ok) {
            return response.json().then(err => {
                throw new Error(err.detail || 'Analysis failed');
            });
        }
        return response.json();
    })
    .then(data => {
        // Store result and redirect
        localStorage.setItem('shand_result', JSON.stringify(data));
        localStorage.setItem('shand_analysis_type', data.analysis_type || 'rule-based');
        window.location.href = 'analysis.html';
    })
    .catch(error => {
        resultDiv.innerHTML = '';
        if (error.message.includes('AI-Enhanced')) {
            showError('AI-Enhanced analysis not available. Using rule-based instead.');
            // Fallback to rule-based
            analyzeText('/analyze/', { text: payload.text });
        } else {
            showError('Error: ' + error.message);
        }
    });
}

function showError(message) {
    alert(message);
}
</script>
